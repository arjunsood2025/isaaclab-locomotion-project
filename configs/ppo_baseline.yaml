# rsl_rl OnPolicyRunner config -- PPO baseline (blind flat/rough policies).
# Passed straight through as the runner's train_cfg dict by source/policies/train.py.
#
# Schema note: this is the rsl-rl >= 5.0 layout. The old single "policy" section was
# split into independent "actor" / "critic" model configs, and the mapping from the
# environment's observation groups to the algorithm's observation sets is now declared
# explicitly under "obs_groups" instead of being implied by the env wrapper.

seed: 42
device: "cuda:0"
max_iterations: 1500          # ~1500 iters x 24 steps x 4096 envs ~ 150M env steps

# rollout: 24 control steps x 4096 envs = 98304 transitions per PPO update
num_steps_per_env: 24
save_interval: 50
experiment_name: go2_rough_baseline
run_name: ""
logger: tensorboard           # or: wandb (also set wandb_project)
wandb_project: isaaclab-locomotion
clip_actions: null            # actions are already bounded by the 0.25 rad action scale
check_for_nan: true

# Asymmetric actor-critic: the deployable actor sees only the noisy "policy" group,
# while the training-only critic sees the privileged, noise-free "critic" group
# (clean state + foot contacts + true height scan). See source/tasks/locomotion_env.py.
obs_groups:
  actor: ["policy"]
  critic: ["critic"]

actor:
  class_name: MLPModel
  hidden_dims: [512, 256, 128]
  activation: elu             # smooth activation -> smoother action landscapes than relu
  obs_normalization: false    # observation scales are already hand-normalized in the env
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0             # generous initial exploration; PPO anneals it
    std_type: scalar

critic:
  class_name: MLPModel
  hidden_dims: [512, 256, 128]
  activation: elu
  obs_normalization: false
  # no distribution_cfg -> deterministic scalar value output

algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 1.0e-3
  schedule: adaptive          # KL-adaptive LR: the workhorse trick for stable locomotion PPO
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null               # must be present: the rsl_rl Logger indexes this key directly
  symmetry_cfg: null
