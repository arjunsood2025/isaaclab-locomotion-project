# PPO config for depth-vision locomotion (task Go2-Vision-v0).
#
# The actor is a CNNModel: rsl_rl routes each observation group by rank -- 1D groups are
# concatenated straight into the MLP, 2D/image groups (B, C, H, W) each get their own CNN
# encoder whose flattened output is concatenated alongside. So the "depth" group declared
# in VisionObservationsCfg is encoded, "policy" (proprioception) is not, and the MLP sees
# [proprio | depth_latent]. The critic stays a plain MLPModel on the privileged "critic"
# group -- asymmetric actor-critic, no pixels in the value function.
#
# Schema: rsl-rl >= 5.0 (see configs/ppo_baseline.yaml for the layout notes).

seed: 42
device: "cuda:0"
max_iterations: 5000          # pixels are slower to learn from than height scans

# fewer envs (1024, set by the env cfg) but longer rollouts keep the batch size healthy:
# 48 steps x 1024 envs = 49152 transitions per update
num_steps_per_env: 48
save_interval: 100
experiment_name: go2_vision
run_name: ""
logger: tensorboard
wandb_project: isaaclab-locomotion
clip_actions: null
check_for_nan: true

obs_groups:
  actor: ["policy", "depth"]  # proprioception + egocentric depth image
  critic: ["critic"]          # privileged: clean state + foot contacts + true height scan

actor:
  class_name: CNNModel
  hidden_dims: [512, 256, 128]
  activation: elu
  # normalizes the 1D groups only; the depth image is already mapped to [0, 1] by
  # source/tasks/observations.py:depth_image, and running stats over 4096 pixel
  # channels would be both wasteful and unstable
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar
  # 5 stride-2 convs take 64x64 -> 2x2; 64 channels x 2 x 2 = 256-dim visual latent.
  # Chosen so the visual latent stays the same order of magnitude as the 48 proprio
  # dims -- a flattened 4x4x64 = 1024 latent would swamp proprioception at the MLP
  # input. Kernel 3 / "zeros" padding = same-size convolutions before striding.
  cnn_cfg:
    output_channels: [16, 32, 64, 64, 64]
    kernel_size: 3
    stride: 2
    padding: zeros
    norm: none
    activation: elu
    flatten: true

critic:
  class_name: MLPModel
  hidden_dims: [512, 256, 128]
  activation: elu
  obs_normalization: false

algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 5.0e-4       # halved: CNN gradients are noisier than MLP-only
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg: null
